name: Build, test and release fork

on:
  push:
    branches: [develop, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Package platforms (automatic releases build Entware)
        type: choice
        options: [entware, all]
        default: entware

permissions:
  contents: read

concurrency:
  group: fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.meta.outputs.configs }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          PLATFORMS: ${{ inputs.platforms || 'entware' }}
        run: |
          echo "version=$(date -u +%Y.%-m.%-d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          pattern = '*/*.config' if os.environ['PLATFORMS'] == 'all' else 'entware/*.config'
          configs = sorted(Path('config').glob(pattern))
          assert configs, 'No build configurations'
          print('configs=' + json.dumps([{'config': str(p), 'name': p.stem, 'platform': p.parent.name} for p in configs]))
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - name: Backend tests including firewall regression tests
        working-directory: src/backend
        run: |
          go test -race -tags testing ./...
          go vet -tags testing ./...
          test -z "$(gofmt -l .)"
          go test -race -tags 'testing entware entware_kn' ./internal/interfaces
      - name: Large rule list benchmarks
        working-directory: src/backend
        run: go test -tags testing -run '^$' -bench 'Benchmark(DNSRuleScan|BulkRuleConversion)$' -benchtime=100ms . ./api/v1
      - name: Install kernel test and shell lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iptables ipset iproute2 iputils-ping shellcheck
      - name: Real IPv4/IPv6 packet and connection marks (isolated namespaces)
        working-directory: src/backend
        run: |
          go test -c -tags integration -o /tmp/routing.test ./utils/netfilterTools
          go test -c -tags integration -o /tmp/ruleset.test .
          for backend in legacy nft; do
            sudo update-alternatives --set iptables /usr/sbin/iptables-$backend
            sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-$backend
            sudo unshare --net /tmp/routing.test -test.run TestRealRouting -test.v
            sudo unshare --net /tmp/ruleset.test -test.run TestRealRuleSetSync -test.v
          done
      - name: Subscription downloads over preferred interface and fallback (isolated namespaces)
        working-directory: src/backend
        run: |
          go test -c -tags integration -o /tmp/subscriptions.test ./subscriptions
          sudo unshare --net /tmp/subscriptions.test -test.run '^TestRealSubscriptionFetch$' -test.v
      - name: Installer checks
        if: ${{ !cancelled() }}
        run: |
          shellcheck -s sh install.sh
          python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Frontend check and build
        if: ${{ !cancelled() }}
        working-directory: src/frontend
        run: |
          npm ci
          npm run check
          npm run build
      - uses: denoland/setup-deno@v2
        if: ${{ !cancelled() }}
        with:
          deno-version: v2.x
      - name: Frontend unit tests
        if: ${{ !cancelled() }}
        working-directory: src/frontend
        run: deno test --no-check --unstable-sloppy-imports tests/unit
      - name: Browser regression tests
        if: ${{ !cancelled() }}
        working-directory: src/frontend
        timeout-minutes: 15
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --retries=0 --max-failures=5

  build:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot upx-ucl
      - name: APK tooling (optional OpenWrt builds)
        if: matrix.platform == 'openwrt'
        run: |
          sudo apt-get install -y meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev
          git clone --depth 1 --branch v3.0.7 https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools
          cd /tmp/apk-tools
          meson setup build -Dpython=disabled -Dtests=disabled -Ddocs=disabled
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
      - name: Build packages
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.version }}
          PKG_VERSION_DISPLAY: ${{ needs.prepare.outputs.version }} (WeirdPhrog)
          PKG_REVISION: '1'
        run: |
          cp '${{ matrix.config }}' .config
          make
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.name }}
          path: |
            .build/*.ipk
            .build/*.apk
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

  release:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: [prepare, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: Prepare release metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp install.sh release/install.sh
          printf '%s\n' "$VERSION" > release/VERSION
          cd release
          sha256sum *.ipk *.sh VERSION > SHA256SUMS
          if compgen -G '*.apk' >/dev/null; then sha256sum *.apk >> SHA256SUMS; fi
      - name: Publish only the complete, tested release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > /tmp/release-notes <<'EOF'
          Groups override overlapping Subscriptions for IPv4 and IPv6, including after subscription refresh and group edits.

          Runtime fixes: restore IPv4/IPv6 routes after VPN/interface recreation even when the gateway is unchanged; keep zero and oversized DNS TTLs finite in ipset; discard stale DNS replies with the wrong transaction ID on reused connections.

          Large lists: DNS matching skips IP/subnet-only rules, bulk rule edits use an ID index, and overlapping CNAME rules no longer repeat the same ipset updates. Rule order and Groups priority are preserved.

          Subscriptions retain one shared download-interface setting with fallback to the system route. The download selector no longer offers the virtual blackhole target. IPv6 addresses in logs use valid notation.

          Entware / Keenetic / Netcraze installation and updates are documented in README.md. Run `magitrickle-update` for future updates from this fork. Existing configuration is backed up and preserved.

          CI includes unit/race tests, large-list benchmarks, real iptables legacy/nft packet and route-restoration tests in isolated network namespaces, installer tests, frontend checks and router package builds. Performance benchmarks run on the CI host, not a physical router.
          EOF
          if gh release view "v$VERSION" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "v$VERSION" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
            if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = false ]; then
              echo 'Release already published; keeping its assets immutable.'
              exit 0
            fi
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "MagiTrickle fork $VERSION" --notes-file /tmp/release-notes --draft
          fi
          gh release upload "v$VERSION" release/* --clobber
          gh release edit "v$VERSION" --draft=false --latest
